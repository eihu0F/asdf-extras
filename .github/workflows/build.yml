name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-install.bash
      - name: Update command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-update.bash
      - name: asdf self-update regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-update-asdf.bash
      - name: Shell initialization refresh tests
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-init-refresh.bash
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: asdf-extras --help
