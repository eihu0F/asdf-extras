name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elvish_completion:
    name: Elvish completion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Elvish 0.21.0
        run: |
          mkdir -p "$RUNNER_TEMP/elvish-completion"
          curl --fail --location \
            https://dl.elv.sh/linux-amd64/elvish-v0.21.0.tar.gz \
            --output "$RUNNER_TEMP/elvish-completion/elvish.tar.gz"
          tar -xzf "$RUNNER_TEMP/elvish-completion/elvish.tar.gz" \
            -C "$RUNNER_TEMP/elvish-completion"
          echo "$RUNNER_TEMP/elvish-completion" >> "$GITHUB_PATH"
      - name: Elvish completion regression tests
        run: bash ./scripts/test-completion-elvish.bash
      - name: Help routing regression tests
        run: bash ./scripts/test-help.bash
      - name: Shell override regression tests
        run: bash ./scripts/test-shell.bash
      - name: Shell initialization refresh tests
        run: bash ./scripts/test-init-refresh.bash
  nushell_completion:
    name: Nushell completion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nushell 0.116.1
        run: |
          mkdir -p "$RUNNER_TEMP/nu-completion"
          curl --fail --location \
            https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/nu-completion/nu.tar.gz"
          tar -xzf "$RUNNER_TEMP/nu-completion/nu.tar.gz" \
            -C "$RUNNER_TEMP/nu-completion" --strip-components=1
          echo "$RUNNER_TEMP/nu-completion" >> "$GITHUB_PATH"
      - name: Nushell completion regression tests
        run: bash ./scripts/test-completion-nushell.bash
      - name: Help routing regression tests
        run: bash ./scripts/test-help.bash
      - name: Shell override regression tests
        run: bash ./scripts/test-shell.bash
      - name: Shell initialization refresh tests
        run: bash ./scripts/test-init-refresh.bash
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-install.bash
      - name: Prune command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-prune.bash
      - name: Get command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-get.bash
      - name: Shell override regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-shell.bash
      - name: Update command regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-update.bash
      - name: asdf self-update regression tests (system Bash)
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-update-asdf.bash
      - name: Shell initialization refresh tests
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-init-refresh.bash
      - name: Completion overlay tests
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-completion.bash
      - name: Help routing regression tests
        shell: /bin/bash {0}
        run: /bin/bash ./scripts/test-help.bash
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: asdf-extras --help
